
services:
  - type: web
    name: supplysense
    runtime: node
    plan: free

    buildCommand: python3 -m venv .venv && .venv/bin/python -m pip install --upgrade pip && .venv/bin/python -m pip install -r ml/requirements.txt && npm ci --include=dev && npm run build && npm run db:generate

    startCommand: npm run db:deploy && npm run db:seed && npm --workspace server run start

    healthCheckPath: /api/v1/health/live

    envVars:
      - key: NODE_ENV
        value: production

      - key: PYTHON_EXECUTABLE
        value: /opt/render/project/src/.venv/bin/python

      - key: DATABASE_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: OTP_SECRET
        generateValue: true

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

      - key: SMTP_HOST
        value: smtp.gmail.com

      - key: SMTP_PORT
        value: "465"

      - key: SMTP_SECURE
        value: "true"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: EMAIL_FROM
        sync: false

      - key: MOCK_PAYMENT_WEBHOOK_SECRET
        generateValue: true

      - key: SEED_ADMIN_PASSWORD
        generateValue: true

      - key: SEED_MANAGER_PASSWORD
        generateValue: true

      - key: SEED_ADMIN_2_PASSWORD
        generateValue: true

      - key: SEED_ADMIN_3_PASSWORD
        generateValue: true

      - key: SEED_MANAGER_2_PASSWORD
        generateValue: true

      - key: SEED_MANAGER_3_PASSWORD
        generateValue: true

      - key: SEED_AUDITOR_PASSWORD
        generateValue: true

      - key: SEED_SUPPLIER_PASSWORD
        generateValue: true

